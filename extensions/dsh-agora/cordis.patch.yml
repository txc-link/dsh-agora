# Install with: dsh plugin --profile <profile> add <path-or-git-url>
# Machine-specific values are intentionally omitted: serverUrl defaults to
# AGORA_SERVER_URL or http://127.0.0.1:18008, nodeId defaults to
# DSH_AGORA_NODE_ID or hostname(), and the default Agent uses process.cwd().
# Production nodes should override them in the profile's cordis.patch.yml.
- insert:
    - id: agora
      name: 'dsh-agora-plugin'
      config:
        requestTimeoutMs: 10000
        defaultCreator: 'dsh'
        commandName: 'agora'
        nodeEnabled: true
        maxConcurrent: 2
